<style>
  html, body { font-family: 'Inter', system-ui, sans-serif; }
  body { background: #0a0d16; color: #eceef2; }
  body.light-mode { background: #f6f7f9; color: #121724; }
  .tabular { font-variant-numeric: tabular-nums; }
  .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(125,135,160,0.25); border-radius: 4px; }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(125,135,160,0.4); }
  .fade-in { animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .slide-in { animation: slideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100% { opacity: 0.4; transform: scale(0.9);} 50% { opacity: 1; transform: scale(1.1);} }
  .typing-dot { animation: typingDot 1.2s infinite; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin: 0 1px; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingDot { 0%,80%,100% { opacity: 0.2; transform: translateY(0);} 40% { opacity: 1; transform: translateY(-3px);} }
  .skeleton { background: linear-gradient(90deg, rgba(125,135,160,0.08) 25%, rgba(125,135,160,0.18) 50%, rgba(125,135,160,0.08) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .lucide-icon { width: 16px; height: 16px; stroke-width: 2; }
  [data-tooltip] { position: relative; }
  .chip-anim { transition: all 0.18s ease; }
  .chip-anim:hover { transform: translateY(-1px); }
  .gauge-arc { transition: stroke-dashoffset 0.8s cubic-bezier(0.22,1,0.36,1); }
  .ring-focus:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
  /* WhatsApp-style chat backdrop, but our own muted pattern */
  .chat-bg-dark { background-color: #0e1320; background-image: radial-gradient(circle at 15% 25%, rgba(6,182,212,0.04) 0, transparent 40%), radial-gradient(circle at 85% 75%, rgba(139,92,246,0.04) 0, transparent 40%); }
  .chat-bg-light { background-color: #ece5dd; background-image: radial-gradient(circle at 15% 25%, rgba(6,182,212,0.06) 0, transparent 40%); }
  .bubble-in { background: #1c2231; }
  .bubble-out { background: #054640; }
  body.light-mode .bubble-in { background: #ffffff; color: #121724; box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
  body.light-mode .bubble-out { background: #d9fdd3; color: #121724; }
  /* Light mode panel surfaces */
  body.light-mode .panel { background: #ffffff; border-color: #e4e7ec; }
  body.light-mode .panel-muted { background: #f6f7f9; border-color: #e4e7ec; }
  body.light-mode .text-muted { color: #525a6f; }
  body.light-mode .text-default { color: #121724; }
  body.light-mode .subtle-border { border-color: #e4e7ec; }
  body.light-mode .input { background: #ffffff; border-color: #d6dae3; color: #121724; }
  body.light-mode .topbar-bg { background: rgba(255,255,255,0.85); border-color: #e4e7ec; }
  body.light-mode .sidebar-bg { background: #ffffff; border-color: #e4e7ec; }
  body.light-mode .nav-item-active { background: #ecfeff; color: #0e7490; }
  body.light-mode .nav-item-idle:hover { background: #f1f5f9; }
  body.light-mode .chat-bg { background-color: #ece5dd; }
  /* Dark mode defaults (apply by default) */
  .panel { background: #121724; border-color: rgba(255,255,255,0.06); }
  .panel-muted { background: #0e1320; border-color: rgba(255,255,255,0.04); }
  .text-muted { color: #7c8499; }
  .text-default { color: #eceef2; }
  .subtle-border { border-color: rgba(255,255,255,0.06); }
  .input { background: #0a0d16; border-color: rgba(255,255,255,0.08); color: #eceef2; }
  .topbar-bg { background: rgba(10,13,22,0.7); backdrop-filter: blur(12px); border-color: rgba(255,255,255,0.06); }
  .sidebar-bg { background: #0e1320; border-color: rgba(255,255,255,0.06); }
  .nav-item-active { background: rgba(6,182,212,0.12); color: #67e8f9; }
  .nav-item-idle:hover { background: rgba(255,255,255,0.04); }
  /* Number ticker */
  .count-up { display: inline-block; }
